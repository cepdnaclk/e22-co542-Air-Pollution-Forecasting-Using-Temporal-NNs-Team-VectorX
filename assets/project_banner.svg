<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)"/>

  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Ambient Glowing Orbs -->
  <circle cx="1050" cy="80" r="160" fill="#06B6D4" opacity="0.12" filter="url(#glow)"/>
  <circle cx="150" cy="280" r="140" fill="#8B5CF6" opacity="0.10" filter="url(#glow)"/>

  <!-- Atmospheric Wave Area -->
  <path d="M 0 260 Q 200 210, 400 250 T 800 230 T 1200 210 L 1200 360 L 0 360 Z" fill="url(#glowGrad)"/>
  <path d="M 0 260 Q 200 210, 400 250 T 800 230 T 1200 210" fill="none" stroke="url(#accentCyan)" stroke-width="2.5" opacity="0.65"/>
  <path d="M 0 280 Q 250 240, 500 275 T 950 245 T 1200 250" fill="none" stroke="url(#accentPurple)" stroke-width="1.8" opacity="0.45"/>

  <!-- Top Category Chip -->
  <g transform="translate(60, 42)">
    <rect width="360" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="15" cy="15" r="5" fill="#10B981"/>
    <text x="30" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="1">UNIVERSITY OF PERADENIYA • CO5420</text>
  </g>

  <!-- Title Text -->
  <g transform="translate(60, 115)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      Air Pollution Forecasting
    </text>
    <text y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="url(#accentCyan)">
      Using Temporal Neural Networks &amp; SOTA Hybrid Ensembles
    </text>
    <text y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#94A3B8">
      Multi-Site Hourly PM2.5 Prediction across 12 Beijing Monitoring Stations with Physics-Informed Feature Engineering
    </text>
  </g>

  <!-- Metric Badges / Feature Cards (Right Side) -->
  <g transform="translate(660, 45)">
    <!-- Card 1: Best Score -->
    <g transform="translate(0, 0)">
      <rect width="220" height="68" rx="10" fill="url(#cardBg)" stroke="#38BDF8" stroke-width="1.2"/>
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="1">TOP VERIFIED RMSE</text>
      <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">14.04457</text>
      <text x="145" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#10B981">(-1.67 pts)</text>
    </g>

    <!-- Card 2: Engineered Features -->
    <g transform="translate(240, 0)">
      <rect width="220" height="68" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2"/>
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1">FEATURE SPACE</text>
      <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">166</text>
      <text x="75" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Atmospheric &amp; Lags</text>
    </g>

    <!-- Card 3: Model Architecture -->
    <g transform="translate(0, 82)">
      <rect width="220" height="68" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2"/>
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1">DEEP LEARNING CORE</text>
      <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">ResNet-BiLSTM</text>
    </g>

    <!-- Card 4: Ensembling Algorithm -->
    <g transform="translate(240, 82)">
      <rect width="220" height="68" rx="10" fill="url(#cardBg)" stroke="#8B5CF6" stroke-width="1.2"/>
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#C084FC" letter-spacing="1">ENSEMBLE METHOD</text>
      <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">SLSQP Blending</text>
    </g>
  </g>

  <!-- Bottom Badges Strip -->
  <g transform="translate(60, 275)">
    <g transform="translate(0, 0)">
      <rect width="120" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="60" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">12 Stations</text>
    </g>
    <g transform="translate(130, 0)">
      <rect width="145" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="72.5" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">315,648 Hourly Pts</text>
    </g>
    <g transform="translate(285, 0)">
      <rect width="135" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="67.5" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">5-Fold Stratified</text>
    </g>
    <g transform="translate(430, 0)">
      <rect width="160" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="80" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">NVIDIA RTX 6000 Ada</text>
    </g>
    <g transform="translate(600, 0)">
      <rect width="130" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="65" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">5 Models Blended</text>
    </g>
  </g>
</svg>
